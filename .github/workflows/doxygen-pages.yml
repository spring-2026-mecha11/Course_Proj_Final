name: Deploy Doxygen to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz

      - name: Install Doxygen 1.17.0
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/doxygen.tar.gz \
            https://github.com/doxygen/doxygen/releases/download/Release_1_17_0/doxygen-1.17.0.linux.bin.tar.gz
          tar --extract --gzip --file /tmp/doxygen.tar.gz --directory /tmp
          sudo install /tmp/doxygen-1.17.0/bin/doxygen /usr/local/bin/doxygen
          test "$(doxygen --version)" = "1.17.0"

      - name: Build documentation
        run: doxygen Doxyfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
